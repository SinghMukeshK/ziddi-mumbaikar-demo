        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QurbaniBookingRequest:
      type: object
      required:
        - package_id
        - quantity
      properties:
        package_id:
          type: string
          format: uuid
        quantity:
