        beneficiary:
          $ref: '#/components/schemas/Beneficiary'
        amount:
          type: number
          format: decimal
        disbursement_date:
          type: string
          format: date
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        created_at:
          type: string
          format: date-time

    # ==================== QURBANI ====================
    QurbaniBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        booking_number:
          type: string
        user:
          $ref: '#/components/schemas/User'
        package:
          type: object
          properties:
            id:
              type: string
              format: uuid
            animal_type:
              type: string
              enum: [goat, sheep, cow, cow_share, camel]
            price:
              type: number
              format: decimal
            shares_total:
              type: integer
        season:
          type: object
          properties:
            id:
              type: string
              format: uuid
            year:
              type: integer
