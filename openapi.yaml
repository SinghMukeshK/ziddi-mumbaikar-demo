          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'

    Ledger:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        coa_id: { type: string, format: uuid }
        parent_ledger_id: { type: string, format: uuid }
