        bank_accounts:
          type: array
          items: { $ref: '#/components/schemas/LedgerBankAccount' }
        licenses:
          type: array
          items: { $ref: '#/components/schemas/LedgerLicense' }

    LedgerTaxDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        state_code: { type: string }
        gst_number: { type: string }
        pan_number: { type: string }
        tan_number: { type: string }
        msme_number: { type: string }
        is_primary: { type: boolean }
        address_line1: { type: string }
        address_line2: { type: string }
        city: { type: string }
        state: { type: string }
