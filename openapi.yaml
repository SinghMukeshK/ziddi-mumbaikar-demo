          type: string
          enum: [create, update, delete, login, logout]
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        old_values:
          type: object
          additionalProperties: true
        new_values:
          type: object
          additionalProperties: true
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time

    # ==================== TESTIMONIALS ====================
    Testimonial:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        author_name: { type: string }
        role: { type: string }
        company: { type: string }
        content: { type: string }
        image_url: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        is_featured: { type: boolean }
        display_order: { type: integer }
        created_at: { type: string, format: date-time }

    TestimonialCreateRequest:
      type: object
      required: [author_name, content]
      properties:
        author_name: { type: string }
        role: { type: string }
        company: { type: string }
        content: { type: string }
        image_url: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        is_featured: { type: boolean }
        display_order: { type: integer }

    # ==================== GALLERY ====================
    GalleryAlbum:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        cover_image_url: { type: string }
        event_date: { type: string, format: date }
        is_featured: { type: boolean }
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        created_at: { type: string, format: date-time }

    GalleryAlbumCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        cover_image_url: { type: string }
        event_date: { type: string, format: date }
        is_featured: { type: boolean }

    # ==================== HOMEPAGE BANNERS ====================
    HomepageBanner:
      type: object
