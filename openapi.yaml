        - total_assets
        - total_liabilities
      properties:
        gold_value:
          type: number
          format: decimal
        silver_value:
          type: number
          format: decimal
        cash_in_hand:
          type: number
          format: decimal
        cash_in_bank:
          type: number
          format: decimal
        investments:
          type: number
          format: decimal
        business_assets:
          type: number
          format: decimal
        receivables:
          type: number
          format: decimal
        other_assets:
          type: number
          format: decimal
        total_assets:
          type: number
          format: decimal
        total_liabilities:
          type: number
          format: decimal

