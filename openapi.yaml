                format: uuid
              name:
                type: string
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BlogPostCreateRequest:
      type: object
      required:
        - title
        - content
      properties:
        title:
          type: string
          minLength: 5
        slug:
          type: string
        content:
          type: string
          minLength: 50
        excerpt:
          type: string
        cover_image_url:
          type: string
        tags:
          type: array
          items:
            type: string

    # ==================== MEDIA ====================
    MediaItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        file_name:
          type: string
        file_url:
          type: string
        file_type:
          type: string
          enum: [image, video, document, audio]
        mime_type:
          type: string
        file_size:
          type: integer
        alt_text:
          type: string
        caption:
          type: string
        folder:
          type: string
        width:
          type: integer
        height:
          type: integer
        uploaded_by:
          $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time

    # ==================== SETTINGS ====================
    SiteSetting:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        setting_key:
          type: string
        setting_value:
          type: string
        setting_type:
          type: string
          enum: [text, number, boolean, json, image]
        group_name:
          type: string
        updated_at:
          type: string
          format: date-time

    # ==================== AUDIT ====================
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
