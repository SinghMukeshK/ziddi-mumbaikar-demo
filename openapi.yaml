          format: uuid
        tenant_id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/User'
        gold_value:
          type: number
          format: decimal
        silver_value:
          type: number
          format: decimal
        cash_in_hand:
          type: number
          format: decimal
        cash_in_bank:
          type: number
          format: decimal
        investments:
          type: number
          format: decimal
        business_assets:
          type: number
          format: decimal
        receivables:
          type: number
          format: decimal
        other_assets:
          type: number
          format: decimal
        total_assets:
          type: number
          format: decimal
        total_liabilities:
          type: number
          format: decimal
        net_zakatable:
          type: number
          format: decimal
        nisab_threshold:
          type: number
          format: decimal
        zakat_amount:
          type: number
          format: decimal
        is_zakat_due:
          type: boolean
        calculation_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time

    ZakatCalculationRequest:
      type: object
