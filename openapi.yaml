        id: { type: string, format: uuid }
        animal_type: { type: string, enum: [goat, cow, cow_share, sheep, camel] }
        breed: { type: string }
        weight_kg: { type: number }
        price: { type: number }
        is_available: { type: boolean }
        shares_total: { type: integer }
        shares_booked: { type: integer }

    # ==================== CONTENT ====================
    BlogPost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        excerpt:
          type: string
        cover_image_url:
          type: string
