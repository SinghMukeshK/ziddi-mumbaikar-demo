      tags:
        - Donors
      summary: List donors
      description: Retrieve list of donors with filtering and pagination
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: donor_type
          in: query
          schema:
            type: string
            enum: [individual, corporate, institution, trust]
        - name: donor_tier
          in: query
          schema:
            type: string
            enum: [platinum, gold, silver, bronze, regular]
        - name: search
          in: query
          description: Search by name or email
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of donors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Donor'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - access denied

    post:
      tags:
        - Donors
      summary: Create new donor
      description: Add a new donor to the CRM system
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonorCreateRequest'
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Donor created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donor'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '409':
          description: Email already exists

  /donors/{id}:
    get:
      tags:
        - Donors
      summary: Get donor details
      description: Retrieve detailed information about a specific donor
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ResourceID'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Donor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donor'
        '401':
          description: Unauthorized
        '404':
          description: Donor not found

    put:
      tags:
        - Donors
      summary: Update donor
      description: Update donor information and preferences
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonorUpdateRequest'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Donor updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donor'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '404':
          description: Donor not found

    delete:
      tags:
        - Donors
      summary: Delete donor
      description: Remove a donor from the system
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ResourceID'
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Donor deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Donor not found

  /donors/{id}/donations:
    get:
      tags:
        - Donors
      summary: Get donor donation history
      description: Retrieve all donations made by a specific donor
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
