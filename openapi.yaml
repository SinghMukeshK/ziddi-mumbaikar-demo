  # ==================== UPLOAD ====================
  /upload/{module}:
    post:
      tags:
        - Media
      summary: Upload a file
      description: Upload a file to a specific module folder (e.g. fundraisers, volunteers)
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [fundraisers, volunteers, donors, programs, events, common]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      url: { type: string }
                  message: { type: string }

  /upload/{module}/{id}:
    post:
      tags:
        - Media
      summary: Upload a file for a specific resource
      description: Upload a file to a resource-specific subfolder
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [fundraisers, volunteers, donors, programs, events, common]
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      url: { type: string }
                  message: { type: string }

  /upload/delete:
    post:
      tags:
        - Media
      summary: Delete a file
      description: Remove a file from storage using its path
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: The full path or URL of the file to delete
      security:
        - BearerAuth: []
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
