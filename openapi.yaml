        alt_text: { type: string }
        display_order: { type: integer }

    FundraiserUpdate:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        posted_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    FundraiserDocument:
      type: object
      properties:
