    # ==================== CONTACT INQUIRY ====================
    ContactInquiry:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        subject: { type: string }
        message: { type: string }
        inquiry_type: { type: string }
        status: { type: string, enum: [pending, reviewed, responded, closed] }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContactInquiryCreateRequest:
      type: object
      required: [name, email, subject, message]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        subject: { type: string }
        message: { type: string }
        inquiryType: { type: string }

    ContactInquiryUpdateRequest:
      type: object
      properties:
        status: { type: string, enum: [pending, reviewed, responded, closed] }
        notes: { type: string }

paths:
  # ==================== CONTACT INQUIRIES ====================
  /contact/submit:
    post:
      tags:
        - Content
      summary: Submit a contact inquiry
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInquiryCreateRequest'
      responses:
        '201':
          description: Inquiry submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInquiry'

  /contact/inquiries:
    get:
      tags:
        - Content
      summary: List all contact inquiries
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, reviewed, responded, closed]
      responses:
        '200':
          description: List of inquiries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /contact/inquiries/{id}:
    patch:
      tags:
        - Content
      summary: Update a contact inquiry status
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInquiryUpdateRequest'
      responses:
        '200':
          description: Inquiry updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInquiry'

  # ==================== PUBLIC ====================
  /public/fundraisers:
    get:
      tags:
        - Public
      summary: List fundraisers publicly
      parameters:
        - name: tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of fundraisers

  /public/fundraisers/{id}:
    get:
      tags:
        - Public
      summary: Get fundraiser details publicly
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fundraiser details

  /public/categories:
    get:
      tags:
        - Public
      summary: List fundraiser categories publicly
      responses:
        '200':
          description: List of categories

  /public/donations/create-order:
    post:
      tags:
        - Public
      summary: Create a donation order
      responses:
        '200':
          description: Order created

  # ==================== AUTHENTICATION ====================
  /auth/admin/login:
    post:
      tags:
        - Authentication
      summary: Admin login
      description: Authenticate administrative user and return access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '400':
          description: Validation error

  /auth/admin/register:
    post:
      tags:
        - Authentication
      summary: Admin registration
      description: Register new administrative user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
        '400':
          description: Validation error

  /auth/admin/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid refresh token

  /auth/donor/request-otp:
    post:
      tags:
        - Authentication
      summary: Request donor OTP
      description: Request an OTP for donor login/registration
      responses:
        '200':
          description: OTP requested successfully

  /auth/donor/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify donor OTP
      description: Verify the OTP sent to the donor
      responses:
        '200':
          description: OTP verified successfully

  /auth/volunteer/request-otp:
    post:
      tags:
        - Authentication
      summary: Request volunteer OTP
      description: Request an OTP for volunteer login/registration
      responses:
        '200':
          description: OTP requested successfully

  /auth/volunteer/verify-otp:
    post:
      tags:
