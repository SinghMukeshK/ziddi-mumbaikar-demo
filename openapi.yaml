        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string }
        image_url: { type: string }
        cta_text: { type: string }
        cta_link: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    HomepageBannerCreateRequest:
      type: object
      required: [title, image_url]
      properties:
        title: { type: string }
        subtitle: { type: string }
        image_url: { type: string }
        cta_text: { type: string }
        cta_link: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }

    # ==================== IMPACT COUNTERS ====================
    ImpactCounter:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string }
        count_value: { type: number }
        suffix: { type: string }
        icon: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    ImpactCounterCreateRequest:
      type: object
      required: [title, count_value]
      properties:
        title: { type: string }
        count_value: { type: number }
        suffix: { type: string }
        icon: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }

    # ==================== FAQS ====================
    FAQ:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        question: { type: string }
        answer: { type: string }
        category: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    FAQCreateRequest:
      type: object
      required: [question, answer]
      properties:
        question: { type: string }
        answer: { type: string }
        category: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }

    # ==================== NGO SERVICES ====================
    NgoService:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon: { type: string }
        status: { type: string, enum: [active, inactive] }
        is_free: { type: boolean }
        display_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NgoServiceCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon: { type: string }
        is_free: { type: boolean }
        display_order: { type: integer }

    NgoServiceBooking:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        service:
          $ref: '#/components/schemas/NgoService'
        user_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        booking_date: { type: string, format: date }
        booking_time: { type: string }
        notes: { type: string }
        status: { type: string, enum: [pending, confirmed, completed, cancelled] }
        donation_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    NgoServiceBookingRequest:
      type: object
      required: [service_id, name, phone, address, booking_date]
      properties:
        service_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        booking_date: { type: string, format: date }
        booking_time: { type: string }
        notes: { type: string }
        donation_amount: { type: number }

    NgoServiceBookingStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, confirmed, completed, cancelled] }

paths:
  # ==================== AUTHENTICATION ====================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully logged out
        '401':
          description: Unauthorized

  # ==================== TENANTS ====================
  /tenants:
    get:
      tags:
        - Tenants
      summary: List all tenants
      description: Get list of all tenants (admin only)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of tenants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tenant'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

    post:
      tags:
        - Tenants
      summary: Create new tenant
      description: Create new NGO tenant account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Subdomain already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tenants/{id}:
    get:
      tags:
        - Tenants
      summary: Get tenant details
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - Tenants
      summary: Update tenant
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          description: Tenant not found

    delete:
      tags:
        - Tenants
      summary: Delete tenant
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Tenant deleted successfully
        '404':
          description: Tenant not found

  # ==================== USERS ====================
  /users:
    get:
      tags:
        - Users
      summary: List users
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

    post:
      tags:
        - Users
      summary: Create new user
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      security:
        - BearerAuth: []
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user details
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ResourceID'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    patch:
      tags:
        - Users
      summary: Update user
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ResourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    delete:
      tags:
        - Users
      summary: Delete user
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/ResourceID'
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User deleted successfully
        '404':
          description: User not found

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      parameters:
        - $ref: '#/components/parameters/TenantID'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  # ==================== DONORS ====================
  /donors:
    get:
      tags:
        - Donors
      summary: List donors
      description: Retrieve list of donors with filtering and pagination
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: donor_type
          in: query
          schema:
            type: string
            enum: [individual, corporate, institution, trust]
        - name: donor_tier
          in: query
          schema:
            type: string
            enum: [platinum, gold, silver, bronze, regular]
        - name: search
          in: query
          description: Search by name or email
          schema:
            type: string
      security:
