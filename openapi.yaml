openapi: 3.0.0
info:
  title: Drista Cloud Solutions ERP - Ziddi Mumbaikar NGO API
  description: |
    Multi-tenant SaaS platform API for NGO & CSR management with comprehensive features including:
    - Program & Project management (NGO + CSR dual-mode)
    - Campaign management & fundraising
    - Project fund tracking & utilization
    - Activity management & expense tracking
    - Donation processing
    - Zakat & Qurbani management
    - Volunteer coordination
    - Beneficiary assistance programs
    - Content management
    - Event management
    - FCRA & CSR Schedule VII compliance
  version: 1.0.0
  contact:
    name: Drista Cloud Solutions
    email: api@dristasolutions.com
  license:
    name: Proprietary
    url: https://dristasolutions.com/license

servers:
  - url: https://api.ziddi-mumbaikar.com/v1
    description: Production server
  - url: https://staging-api.ziddi-mumbaikar.com/v1
    description: Staging server
  - url: http://localhost:3000/v1
    description: Development server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Tenants
    description: Tenant/NGO management
  - name: Users
    description: User accounts and profiles
  - name: Fundraisers
    description: Fundraising campaigns
  - name: Donors
    description: Donor management and relationship tracking
  - name: Donations
    description: Donation processing and tracking
  - name: Beneficiaries
    description: Beneficiary management and assistance programs
  - name: Volunteers
    description: Volunteer recruitment and management
  - name: Programs
    description: NGO/CSR programs and services - top-level thematic areas
  - name: Projects
    description: Time-bound, budget-bound initiatives under programs
  - name: Campaigns
    description: Fundraising campaigns linked to projects
  - name: ProjectFunds
    description: Fund allocations, receipts, and utilizations for projects
  - name: Activities
    description: Measurable work items under projects
  - name: ActivityExpenses
    description: Actual expenses incurred during activities
  - name: Events
    description: Event management
  - name: Zakat
    description: Zakat calculations and distributions
  - name: Qurbani
    description: Qurbani/Udhiyah bookings
  - name: Content
    description: Pages, blog posts, and testimonials
  - name: Media
    description: Media library management and file uploads
  - name: Settings
    description: Site settings and configuration
  - name: Audit
    description: Audit logs and activity tracking
  - name: NGO Services
    description: NGO specialized services and booking management
  - name: Finance
    description: Chart of Accounts, Double Entry Journal, and Ledger

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  headers:
    X-Tenant-ID:
      schema:
        type: string
        format: uuid
      description: Tenant ID for multi-tenant operations
      required: true

  parameters:
    TenantID:
      name: tenant-id
      in: header
      description: Tenant UUID for multi-tenant isolation
      required: true
      schema:
        type: string
        format: uuid
    
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        default: 1
        minimum: 1
    
    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    
    SortBy:
      name: sort_by
      in: query
      description: Field to sort by
      schema:
        type: string
    
    SortOrder:
      name: sort_order
      in: query
      description: Sort order (asc/desc)
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # ==================== COMMON SCHEMAS ====================
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input provided
        details:
          type: object
          additionalProperties: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        total_pages:
          type: integer
          example: 8

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ==================== AUTHENTICATION ====================
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        expires_in:
          type: integer
          description: Token expiry in seconds
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
        - password_confirm
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirm:
          type: string
          format: password
        phone:
          type: string
        organization_name:
          type: string

    # ==================== TENANTS ====================
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        legal_name: { type: string }
        subdomain: { type: string }
        website: { type: string }
        logo_url: { type: string }
        business_type: { type: string }
        industry: { type: string }
        year_founded: { type: integer }
        company_size: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        street_address: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        country: { type: string, default: India }
        country_code: { type: string }
        registration_number: { type: string }
        tax_id: { type: string }
        vat_number: { type: string }
        ngo_80g: { type: string }
        ngo_12a: { type: string }
        pan_number: { type: string }
        billing_contact_name: { type: string }
        billing_contact_email: { type: string, format: email }
        billing_contact_phone: { type: string }
        technical_contact_name: { type: string }
        technical_contact_email: { type: string, format: email }
        technical_contact_phone: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        subscription_status: { $ref: '#/components/schemas/TenantSubscriptionStatus' }
        plan: { $ref: '#/components/schemas/TenantPlan' }
        timezone: { type: string, default: Asia/Kolkata }
        locale: { type: string, default: en-IN }
        currency: { type: string, default: INR }
        date_format: { type: string, default: DD/MM/YYYY }
        number_format: { type: string, default: '#,##,###.##' }
        settings: { type: object }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }

    TenantPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        monthly_price: { type: number }
        annual_price: { type: number }
        currency: { type: string }
        features: { type: object }
        max_users: { type: integer }
        max_beneficiaries: { type: integer }
        max_fundraisers: { type: integer }

    TenantSubscriptionStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }

    TenantTaxDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        state_code: { type: string }
        gst_number: { type: string }
        pan_number: { type: string }
        tan_number: { type: string }
        msme_number: { type: string }
        is_primary: { type: boolean }
        address_line1: { type: string }
        address_line2: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }

    TenantAddress:
      type: object
      properties:
        id: { type: string, format: uuid }
        address_type: { type: string }
        address_line1: { type: string }
        address_line2: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        country: { type: string }
        is_primary: { type: boolean }

    TenantBankAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        bank_name: { type: string }
        account_number: { type: string }
        ifsc_code: { type: string }
        bank_branch: { type: string }
        account_type: { type: string }
        is_primary: { type: boolean }

    TenantLicense:
      type: object
      properties:
        id: { type: string, format: uuid }
        license_type: { type: string }
        license_number: { type: string }
        expiry_date: { type: string, format: date }
        file_url: { type: string }

    TenantCreateRequest:
      type: object
      required: [name, subdomain, email, plan_id]
      properties:
        name: { type: string, minLength: 3, maxLength: 255 }
        legal_name: { type: string }
        subdomain: { type: string, pattern: '^[a-z0-9-]+$', minLength: 3, maxLength: 100 }
        email: { type: string, format: email }
        owner_email: { type: string, format: email }
        business_type: { type: string }
        industry: { type: string }
        website: { type: string, format: uri }
        phone: { type: string }
        plan_id: { type: string, format: uuid }
        street_address: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        country: { type: string, default: India }

    TenantUpdateRequest:
      type: object
      properties:
        name: { type: string }
        legal_name: { type: string }
        website: { type: string }
        logo_url: { type: string }
        business_type: { type: string }
        industry: { type: string }
        year_founded: { type: integer }
        company_size: { type: string }
        phone: { type: string }
        email: { type: string }
        street_address: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        registration_number: { type: string }
        tax_id: { type: string }
        vat_number: { type: string }
        ngo_80g: { type: string }
        ngo_12a: { type: string }
        pan_number: { type: string }
        billing_contact_name: { type: string }
        billing_contact_email: { type: string }
        billing_contact_phone: { type: string }
        technical_contact_name: { type: string }
        technical_contact_email: { type: string }
        technical_contact_phone: { type: string }
        timezone: { type: string }
        locale: { type: string }
        currency: { type: string }
        date_format: { type: string }
        number_format: { type: string }
        settings: { type: object }

    # ==================== ROLES ====================
    UserRole:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        permissions: { type: object }
        is_system: { type: boolean }
        display_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserRoleCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        permissions: { type: object }
        display_order: { type: integer }

    UserRoleUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        permissions: { type: object }
        display_order: { type: integer }

    # ==================== USERS ====================
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        avatar_url:
          type: string
        role:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        status:
          type: string
          enum: [active, inactive, pending, suspended, deleted]
        email_verified:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreateRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
        - role_id
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role_id:
          type: string
          format: uuid
        phone:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        avatar_url:
          type: string
        bio:
          type: string

    # ==================== DONORS ====================
    Donor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        pan_number:
          type: string
        donor_type:
          type: string
          enum: [individual, corporate, institution, trust]
          default: individual
        donor_tier:
          type: string
          enum: [platinum, gold, silver, bronze, regular]
          nullable: true
        is_anonymous:
          type: boolean
        lifetime_donation_amount:
          type: number
          format: decimal
        total_donations:
          type: integer
        last_donation_date:
          type: string
          format: date-time
          nullable: true
        first_donation_date:
          type: string
          format: date-time
          nullable: true
        preferred_donation_type:
          type: string
          enum: [zakat, qurbani, sadaqah, general]
        preferred_fundraiser_category:
          type: string
        communication_preference:
          type: string
          enum: [email, sms, whatsapp, none]
          default: email
        newsletter_subscribed:
          type: boolean
        do_not_contact:
          type: boolean
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        referred_by:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DonorCreateRequest:
      type: object
      required:
        - first_name
        - email
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        pan_number:
          type: string
        donor_type:
          type: string
          enum: [individual, corporate, institution, trust]
        donor_tier:
          type: string
          enum: [platinum, gold, silver, bronze, regular]
        is_anonymous:
          type: boolean
        preferred_donation_type:
          type: string
          enum: [zakat, qurbani, sadaqah, general]
        preferred_fundraiser_category:
          type: string
        communication_preference:
          type: string
          enum: [email, sms, whatsapp, none]
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        referred_by:
          type: string
          format: uuid
        notes:
          type: string

    DonorUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        pan_number:
          type: string
        donor_tier:
          type: string
          enum: [platinum, gold, silver, bronze, regular]
        preferred_donation_type:
          type: string
          enum: [zakat, qurbani, sadaqah, general]
        preferred_fundraiser_category:
          type: string
        communication_preference:
          type: string
          enum: [email, sms, whatsapp, none]
        newsletter_subscribed:
          type: boolean
        do_not_contact:
          type: boolean
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        notes:
          type: string

    # ==================== FUNDRAISERS ====================
    Fundraiser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        short_description:
          type: string
        description:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        goal_amount:
          type: number
          format: decimal
        raised_amount:
          type: number
          format: decimal
        donor_count:
          type: integer
        completion_percentage:
          type: number
          format: float
        currency:
          type: string
          default: INR
        status:
          type: string
          enum: [draft, pending_review, active, paused, completed, cancelled, rejected]
        is_featured:
          type: boolean
        is_urgent:
          type: boolean
        is_zakat_eligible:
          type: boolean
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        beneficiary_name:
          type: string
        beneficiary_story:
          type: string
        cover_image_url:
          type: string
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        created_by:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FundraiserCreateRequest:
      type: object
      required:
        - title
        - description
        - goal_amount
        - category_id
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 300
        slug:
          type: string
        short_description:
          type: string
          maxLength: 500
        description:
          type: string
          minLength: 20
        category_id:
          type: string
          format: uuid
        goal_amount:
          type: number
          format: decimal
          minimum: 0.01
        beneficiary_name:
          type: string
        beneficiary_story:
          type: string
        cover_image_url:
          type: string
        is_zakat_eligible:
          type: boolean
          default: false
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        branch_id:
          type: string
          format: uuid

    FundraiserUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        short_description:
          type: string
        category_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending_review, active, paused, completed, cancelled]
        goal_amount:
          type: number
          format: decimal
        is_featured:
          type: boolean
        is_urgent:
          type: boolean

    # ==================== DONATIONS ====================
    Donation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        donation_number:
          type: string
        donor_id:
          type: string
          format: uuid
          description: Reference to donor from donors table
        donor:
          $ref: '#/components/schemas/Donor'
        fundraiser:
          type: object
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
        donation_type:
          type: string
          enum: [general, zakat, sadaqah, fitrah, qurbani]
        payment_method:
          type: string
          enum: [upi, card, net_banking, wallet, bank_transfer, cash, cheque]
        status:
          type: string
          enum: [pending, completed, failed, refunded, cancelled]
        is_anonymous:
          type: boolean
        transaction_id:
          type: string
        is_recurring:
          type: boolean
        receipt_sent:
          type: boolean
        tax_certificate:
          type: object
          properties:
            id:
              type: string
              format: uuid
            certificate_number:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DonationCreateRequest:
      type: object
      required:
        - fundraiser_id
        - amount
        - payment_method
      properties:
        fundraiser_id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
          description: Reference to existing donor (optional)
        amount:
          type: number
          format: decimal
          minimum: 1
        donation_type:
          type: string
          enum: [general, zakat, sadaqah, fitrah, qurbani]
          default: general
        payment_method:
          type: string
          enum: [upi, card, net_banking, wallet, bank_transfer, cash, cheque]
        donor_name:
          type: string
        donor_email:
          type: string
          format: email
        donor_phone:
          type: string
        donor_pan:
          type: string
        is_anonymous:
          type: boolean
          default: false
        message:
          type: string
        payment_gateway:
          type: string

    # ==================== BENEFICIARIES ====================
    Beneficiary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        full_name:
          type: string
        phone:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        city:
          type: string
        state:
          type: string
        aid_type:
          type: string
          enum: [medical, education, food, financial, marriage, business_setup, emergency, clothing, shelter]
        case_description:
          type: string
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        verification_status:
          type: string
          enum: [pending, verified, rejected]
        is_active:
          type: boolean
        total_aid_received:
          type: number
          format: decimal
        aid_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BeneficiaryCreateRequest:
      type: object
      required:
        - full_name
        - phone
        - aid_type
      properties:
        full_name:
          type: string
          minLength: 2
        phone:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        city:
