openapi: 3.0.0
info:
  title: Drista Cloud Solutions ERP - Ziddi Mumbaikar NGO API
  description: |
    Multi-tenant SaaS platform API for NGO management with comprehensive features including:
    - Fundraising campaigns
    - Donation processing
    - Zakat & Qurbani management
    - Volunteer coordination
    - Beneficiary assistance programs
    - Content management
    - Event management
  version: 1.0.0
  contact:
    name: Drista Cloud Solutions
    email: api@dristasolutions.com
  license:
    name: Proprietary
    url: https://dristasolutions.com/license

servers:
  - url: https://api.ziddi-mumbaikar.com/v1
    description: Production server
  - url: https://staging-api.ziddi-mumbaikar.com/v1
    description: Staging server
  - url: http://localhost:3000/v1
    description: Development server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Tenants
    description: Tenant/NGO management
  - name: Users
    description: User accounts and profiles
  - name: Fundraisers
    description: Fundraising campaigns
  - name: Donors
    description: Donor management and relationship tracking
  - name: Donations
    description: Donation processing and tracking
  - name: Beneficiaries
    description: Beneficiary management and assistance programs
  - name: Volunteers
    description: Volunteer recruitment and management
  - name: Programs
    description: NGO programs and services
  - name: Events
    description: Event management
  - name: Zakat
    description: Zakat calculations and distributions
  - name: Qurbani
    description: Qurbani/Udhiyah bookings
  - name: Content
    description: Pages, blog posts, and testimonials
  - name: Media
    description: Media library management and file uploads
  - name: Settings
    description: Site settings and configuration
  - name: Audit
    description: Audit logs and activity tracking
  - name: NGO Services
    description: NGO specialized services and booking management

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  headers:
    X-Tenant-ID:
      schema:
        type: string
        format: uuid
      description: Tenant ID for multi-tenant operations
      required: true

  parameters:
    TenantID:
      name: tenant-id
      in: header
      description: Tenant UUID for multi-tenant isolation
      required: true
      schema:
        type: string
        format: uuid
    
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        default: 1
        minimum: 1
    
    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    
    SortBy:
      name: sort_by
      in: query
      description: Field to sort by
      schema:
        type: string
    
    SortOrder:
      name: sort_order
      in: query
      description: Sort order (asc/desc)
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # ==================== COMMON SCHEMAS ====================
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input provided
        details:
          type: object
          additionalProperties: true

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        total_pages:
          type: integer
          example: 8

    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ==================== AUTHENTICATION ====================
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        expires_in:
          type: integer
          description: Token expiry in seconds
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    RegisterRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
        - password_confirm
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirm:
          type: string
          format: password
        phone:
          type: string
        organization_name:
          type: string

    # ==================== TENANTS ====================
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        legal_name:
          type: string
        subdomain:
          type: string
        website:
          type: string
        logo_url:
          type: string
        business_type:
          type: string
          enum: [ngo, charity, foundation, institution]
        country:
          type: string
          default: India
        city:
          type: string
        state:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        pan_number:
          type: string
        ngo_80g:
          type: string
        ngo_12a:
          type: string
        status:
          type: string
          enum: [active, inactive, trial, suspended, deleted]
        plan:
          type: string
          enum: [starter, professional, enterprise]
        subscription_status:
          type: string
          enum: [active, past_due, cancelled, expired]
        currency:
          type: string
          default: INR
        timezone:
          type: string
          default: Asia/Kolkata
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantCreateRequest:
      type: object
      required:
        - name
        - subdomain
        - email
        - business_type
        - plan_id
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
        legal_name:
          type: string
        subdomain:
          type: string
          pattern: '^[a-z0-9-]+$'
          minLength: 3
          maxLength: 100
        email:
          type: string
          format: email
        business_type:
          type: string
          enum: [ngo, charity, foundation, institution]
        website:
          type: string
          format: uri
        phone:
          type: string
        plan_id:
          type: string
          format: uuid
        country:
          type: string
          default: India

    # ==================== USERS ====================
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        avatar_url:
          type: string
        role:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        status:
          type: string
          enum: [active, inactive, pending, suspended, deleted]
        email_verified:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreateRequest:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
        - role_id
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role_id:
          type: string
          format: uuid
        phone:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        avatar_url:
          type: string
        bio:
          type: string

    # ==================== DONORS ====================
    Donor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        pan_number:
          type: string
        donor_type:
          type: string
          enum: [individual, corporate, institution, trust]
          default: individual
        donor_tier:
          type: string
          enum: [platinum, gold, silver, bronze, regular]
          nullable: true
        is_anonymous:
          type: boolean
        lifetime_donation_amount:
          type: number
          format: decimal
        total_donations:
          type: integer
        last_donation_date:
          type: string
          format: date-time
          nullable: true
        first_donation_date:
          type: string
          format: date-time
          nullable: true
        preferred_donation_type:
          type: string
          enum: [zakat, qurbani, sadaqah, general]
        preferred_fundraiser_category:
          type: string
        communication_preference:
          type: string
          enum: [email, sms, whatsapp, none]
          default: email
        newsletter_subscribed:
          type: boolean
        do_not_contact:
          type: boolean
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        referred_by:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DonorCreateRequest:
      type: object
      required:
        - first_name
        - email
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        pan_number:
          type: string
        donor_type:
          type: string
          enum: [individual, corporate, institution, trust]
        donor_tier:
          type: string
          enum: [platinum, gold, silver, bronze, regular]
        is_anonymous:
          type: boolean
        preferred_donation_type:
          type: string
          enum: [zakat, qurbani, sadaqah, general]
        preferred_fundraiser_category:
          type: string
        communication_preference:
          type: string
          enum: [email, sms, whatsapp, none]
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        referred_by:
          type: string
          format: uuid
        notes:
          type: string

    DonorUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        pan_number:
          type: string
        donor_tier:
          type: string
          enum: [platinum, gold, silver, bronze, regular]
        preferred_donation_type:
          type: string
          enum: [zakat, qurbani, sadaqah, general]
        preferred_fundraiser_category:
          type: string
        communication_preference:
          type: string
          enum: [email, sms, whatsapp, none]
        newsletter_subscribed:
          type: boolean
        do_not_contact:
          type: boolean
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        notes:
          type: string

    # ==================== FUNDRAISERS ====================
    Fundraiser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        short_description:
          type: string
        description:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        goal_amount:
          type: number
          format: decimal
        raised_amount:
          type: number
          format: decimal
        donor_count:
          type: integer
        completion_percentage:
          type: number
          format: float
        currency:
          type: string
          default: INR
        status:
          type: string
          enum: [draft, pending_review, active, paused, completed, cancelled, rejected]
        is_featured:
          type: boolean
        is_urgent:
          type: boolean
        is_zakat_eligible:
          type: boolean
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        beneficiary_name:
          type: string
        beneficiary_story:
          type: string
        cover_image_url:
          type: string
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        created_by:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FundraiserCreateRequest:
      type: object
      required:
        - title
        - description
        - goal_amount
        - category_id
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 300
        slug:
          type: string
        short_description:
          type: string
          maxLength: 500
        description:
          type: string
          minLength: 20
        category_id:
          type: string
          format: uuid
        goal_amount:
          type: number
          format: decimal
          minimum: 0.01
        beneficiary_name:
          type: string
        beneficiary_story:
          type: string
        cover_image_url:
          type: string
        is_zakat_eligible:
          type: boolean
          default: false
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        branch_id:
          type: string
          format: uuid

    FundraiserUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        short_description:
          type: string
        category_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, pending_review, active, paused, completed, cancelled]
        goal_amount:
          type: number
          format: decimal
        is_featured:
          type: boolean
        is_urgent:
          type: boolean

    # ==================== DONATIONS ====================
    Donation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        donation_number:
          type: string
        donor_id:
          type: string
          format: uuid
          description: Reference to donor from donors table
        donor:
          $ref: '#/components/schemas/Donor'
        fundraiser:
          type: object
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
        donation_type:
          type: string
          enum: [general, zakat, sadaqah, fitrah, qurbani]
        payment_method:
          type: string
          enum: [upi, card, net_banking, wallet, bank_transfer, cash, cheque]
        status:
          type: string
          enum: [pending, completed, failed, refunded, cancelled]
        is_anonymous:
          type: boolean
        transaction_id:
          type: string
        is_recurring:
          type: boolean
        receipt_sent:
          type: boolean
        tax_certificate:
          type: object
          properties:
            id:
              type: string
              format: uuid
            certificate_number:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DonationCreateRequest:
      type: object
      required:
        - fundraiser_id
        - amount
        - payment_method
      properties:
        fundraiser_id:
          type: string
          format: uuid
        donor_id:
          type: string
          format: uuid
          description: Reference to existing donor (optional)
        amount:
          type: number
          format: decimal
          minimum: 1
        donation_type:
          type: string
          enum: [general, zakat, sadaqah, fitrah, qurbani]
          default: general
        payment_method:
          type: string
          enum: [upi, card, net_banking, wallet, bank_transfer, cash, cheque]
        donor_name:
          type: string
        donor_email:
          type: string
          format: email
        donor_phone:
          type: string
        donor_pan:
          type: string
        is_anonymous:
          type: boolean
          default: false
        message:
          type: string
        payment_gateway:
          type: string

    # ==================== BENEFICIARIES ====================
    Beneficiary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        full_name:
          type: string
        phone:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        city:
          type: string
        state:
          type: string
        aid_type:
          type: string
          enum: [medical, education, food, financial, marriage, business_setup, emergency, clothing, shelter]
        case_description:
          type: string
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        verification_status:
          type: string
          enum: [pending, verified, rejected]
        is_active:
          type: boolean
        total_aid_received:
          type: number
          format: decimal
        aid_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BeneficiaryCreateRequest:
      type: object
      required:
        - full_name
        - phone
        - aid_type
      properties:
        full_name:
          type: string
          minLength: 2
        phone:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        date_of_birth:
          type: string
          format: date
        address:
          type: string
        city:
          type: string
        state:
          type: string
        aid_type:
          type: string
          enum: [medical, education, food, financial, marriage, business_setup, emergency, clothing, shelter]
        case_description:
          type: string
        branch_id:
          type: string
          format: uuid

    # ==================== VOLUNTEERS ====================
    Volunteer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        date_of_birth:
          type: string
          format: date
        occupation:
          type: string
        skills:
          type: array
          items:
            type: string
        availability:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        motivation:
          type: string
        status:
          type: string
          enum: [applied, approved, active, inactive, rejected]
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        total_hours:
          type: number
          format: decimal
        activity_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VolunteerCreateRequest:
      type: object
      required:
        - first_name
        - email
        - phone
      properties:
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        gender:
          type: string
          enum: [male, female, other]
        date_of_birth:
          type: string
          format: date
        occupation:
          type: string
        skills:
          type: array
          items:
            type: string
        availability:
          type: string
        address:
          type: string
        city:
          type: string
        motivation:
          type: string
        preferred_branch_id:
          type: string
          format: uuid

    # ==================== PROGRAMS ====================
    Program:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        short_description:
          type: string
        description:
          type: string
        program_type:
          type: string
          enum: [education, medical, social_service, dawah, emergency, food]
        is_active:
          type: boolean
        cover_image_url:
          type: string
        icon_url:
          type: string
        beneficiary_count:
          type: integer
        statistics:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              value:
                type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgramCreateRequest:
      type: object
      required:
        - name
        - description
        - program_type
      properties:
        name:
          type: string
          minLength: 3
        slug:
          type: string
        short_description:
          type: string
        description:
          type: string
          minLength: 20
        program_type:
          type: string
          enum: [education, medical, social_service, dawah, emergency, food]
        cover_image_url:
          type: string
        icon_url:
          type: string

    # ==================== EVENTS ====================
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        event_type:
          type: string
          enum: [fundraising, distribution, seminar, iftar, qurbani]
        location:
          type: string
        branch:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        is_online:
          type: boolean
        online_link:
          type: string
        max_attendees:
          type: integer
        registration_required:
          type: boolean
        registration_count:
          type: integer
        status:
          type: string
          enum: [draft, published, archived]
        cover_image_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventCreateRequest:
      type: object
      required:
        - title
        - start_datetime
        - event_type
      properties:
        title:
          type: string
          minLength: 3
        slug:
          type: string
        description:
          type: string
        event_type:
          type: string
          enum: [fundraising, distribution, seminar, iftar, qurbani]
        location:
          type: string
        branch_id:
          type: string
          format: uuid
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        is_online:
          type: boolean
        online_link:
          type: string
        max_attendees:
          type: integer
        registration_required:
          type: boolean
        cover_image_url:
