                project_id: { type: string }
                amount: { type: number }
                currency: { type: string, default: INR }
                frequency: { type: string, enum: [daily, weekly, monthly, quarterly, yearly] }
                donor_name: { type: string }
                donor_email: { type: string }
                donor_phone: { type: string }
                is_anonymous: { type: boolean }
                message: { type: string }
      responses:
        '201':
          description: Subscription initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription_id: { type: string, format: uuid }
                  gateway_subscription_id: { type: string }
